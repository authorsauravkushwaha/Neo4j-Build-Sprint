# ============================================================================
# GraphMentor AI — PostgreSQL policy (source of truth)
#
# This file is copied into PGDATA at provision time and its SHA-256 is recorded
# in the cluster. `npm run verify:db` refuses to pass if the live file differs
# from this one, so a hand-edit on a running server is detected as drift rather
# than silently accepted.
#
# Only settings we deliberately choose appear here; PostgreSQL supplies the
# compiled defaults for everything else.
# ============================================================================

# ---- Where it listens -------------------------------------------------------
# Loopback only. Nothing off this machine can reach the port, whatever the
# firewall says. Verified from `ss -ltn` by the verifier.
listen_addresses = '127.0.0.1'
port = 5433
# The socket directory is set, but pg_hba.conf rejects every `local` connection:
# the socket exists so tooling that insists on one fails cleanly, not silently.
unix_socket_directories = '/srv/graphmentor-pg/run'
unix_socket_permissions = 0700

# ---- Transport security -----------------------------------------------------
ssl = on
ssl_cert_file = '/srv/graphmentor-pg/certs/server.crt'
ssl_key_file = '/srv/graphmentor-pg/certs/server.key'
# Client certificates are issued by a private CA on this machine; pg_hba.conf
# requires one (clientcert=verify-full) in addition to a password.
ssl_ca_file = '/srv/graphmentor-pg/certs/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'
ssl_ciphers = 'HIGH:!aNULL:!eNULL:!MD5:!3DES:!DES:!RC4:!PSK'
ssl_prefer_server_ciphers = on
authentication_timeout = '10s'

# ---- Authentication ---------------------------------------------------------
# Hashes only. `md5` is never acceptable and `trust` is what a development
# database ships with by accident.
password_encryption = 'scram-sha-256'

# ---- Authorisation helpers --------------------------------------------------
row_security = on
# A CREATEROLE role may not grant itself membership of roles it administers.
createrole_self_grant = ''
# passwordcheck refuses trivially weak passwords at CREATE/ALTER ROLE time;
# pg_stat_statements gives us a statement-level audit surface.
shared_preload_libraries = 'passwordcheck,pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 5000

# ---- Connections, so one client cannot starve the server --------------------
max_connections = 40
superuser_reserved_connections = 3
# No replication at all: nothing can open a replication connection.
max_wal_senders = 0
max_replication_slots = 0
wal_level = 'replica'

# ---- Resource ceilings: the difference between a slow query and an outage ---
statement_timeout = '15s'
transaction_timeout = '45s'
idle_in_transaction_session_timeout = '10s'
idle_session_timeout = '20min'
lock_timeout = '5s'
temp_file_limit = '256MB'
work_mem = '8MB'
maintenance_work_mem = '128MB'

# ---- Durability -------------------------------------------------------------
fsync = on
full_page_writes = on
synchronous_commit = on
wal_compression = on

# ---- Audit trail ------------------------------------------------------------
# Every connection, every disconnection, every DDL statement and every query
# slower than a second. Failed logins are the signal a brute-force attempt
# leaves behind, and on PostgreSQL 17 they are already recorded: a rejected
# password is a FATAL line in this log, which the verifier counts back after
# firing fifteen wrong passwords at the server. (PostgreSQL 18 adds an explicit
# `log_failed_connections` setting; this server is 17, so the setting is
# deliberately absent rather than present-and-ignored.)
log_connections = on
log_disconnections = on
log_statement = 'ddl'
log_min_duration_statement = 1000
log_lock_waits = on
log_temp_files = 0
log_checkpoints = on
log_error_verbosity = 'default'
log_line_prefix = '%m [%p] %q%u@%d/%a %h '
log_timezone = 'UTC'
timezone = 'UTC'

# ---- Disk housekeeping ------------------------------------------------------
track_counts = on
autovacuum = on


