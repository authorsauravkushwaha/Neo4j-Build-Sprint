# ============================================================================
# GraphMentor AI — client authentication policy (source of truth)
#
# Copied into PGDATA at provision time; `npm run verify:db` fails if the live
# file differs from this one.
#
# Read the rules as a whitelist, because that is what they are:
#
#   local  — every Unix-socket connection is refused, for every role.
#   hostnossl — every plaintext TCP connection is refused, for every role and
#               every address. There is no way to reach this server without TLS.
#   hostssl   — the only three accepted forms: one credential-holding role,
#               from loopback, with a SCRAM-SHA-256 password over TLS.
#   host      — a final catch-all refusal, so an address outside 127.0.0.1/32
#               is rejected by policy as well as by `listen_addresses`.
#
# There is no `trust` line and no `peer` line anywhere in this file, which is
# the single most common way a development Postgres is found wide open.
# ============================================================================

# TYPE      DATABASE        USER            ADDRESS         METHOD
local       all             all                             reject

hostnossl   all             all             all             reject

# clientcert=verify-full means two independent things must both be true: the
# connection must present a certificate signed by the project's private CA whose
# CN matches the role name, and it must give that role's password. That matters
# on this host, where the sandbox's own port forwarder accepts connections on a
# non-loopback address and re-originates them from 127.0.0.1: a forwarded
# connection arrives looking local, so the credential alone must not be enough.
hostssl     all             gm_admin        127.0.0.1/32    scram-sha-256 clientcert=verify-full
hostssl     graphmentor     gm_app          127.0.0.1/32    scram-sha-256 clientcert=verify-full
hostssl     graphmentor     gm_auth         127.0.0.1/32    scram-sha-256 clientcert=verify-full
# The RLS verifier and the HTTP smoke test drive a superuser session and switch
# roles inside it; that harness is the only other accepted connection.
hostssl     all             gm_admin        ::1/128         scram-sha-256 clientcert=verify-full

host        all             all             all             reject


