# Build, verify and publish.
#
# Runs on every push to main and on pull requests (verification only).
# Publish step needs: Settings -> Pages -> Source: GitHub Actions.
#
# URL and base path are derived from the repository, because on GitHub Pages those two
# are not free choices: a repository named `<owner>.github.io` is served at the domain
# root and everything else is served from `/<repo-name>/`. Getting that wrong is the one
# mistake that turns a deployment into a blank page, so it is computed here instead of
# trusted to a variable somebody remembers to set:
#
#   https://authorsauravkushwaha.github.io/Neo4j-Build-Sprint/   <- this repository
#   https://authorsauravkushwaha.github.io/                       <- a `<owner>.github.io` repository
#
# Repository secrets (optional — the app runs with none of them set, in clearly
# labelled demo mode):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_SITE_URL
# Repository variables (optional — both are derived from the repository when unset):
#   VITE_BASE_PATH            override the computed base path, e.g. "/" to force the root
#   VITE_API_BASE_URL         public backend API base embedded into the build
#                             (e.g. https://<actual-service>/functions/v1). This is
#                             not a secret. Empty means the published site runs demo data.
#                             Set it and trigger a new Pages build to update the artifact.
#   VITE_CSP_EXTRA_CONNECT_SRC  extra connect-src host when the API sits behind a
#                             different hostname than VITE_API_BASE_URL (rare)
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this run to GitHub Pages (verification only when unset)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, test, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` installs exactly package-lock.json, so CI cannot drift from
      # what was tested locally.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Fails if any tracked file contains a credential-shaped string. Runs
      # before the build so a leaked key stops the pipeline, not the deploy.
      - name: Secret scan
        run: npm run lint:secrets

      - name: Validate dataset and engine
        run: npm run validate:seed

      - name: Check generated Cypher is current
        run: npm run emit:cypher -- --check

  build:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    # Publishing happens from main, and from a manually dispatched run that asked for
    # it — which is how a branch can be published for review before it is merged.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `enablement` turns on Pages (Source: GitHub Actions) if it is not already on.
      # It works when the token backing the run is allowed to create the site — and it
      # cannot, GitHub refuses for a workflow token ("Resource not accessible by
      # integration"). The step below turns that stack trace into the one click that
      # fixes it.
      - name: Configure Pages
        id: pages-config
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain a Pages enablement failure
        if: failure() && steps.pages-config.outcome == 'failure'
        run: |
          echo "::error title=Pages is not enabled on this repository::GitHub will not let a workflow token create a Pages site. Enable it once by hand: Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Every deploy after that is automatic - re-run this workflow or merge into main."
          exit 1

      # The address the site will be reachable at, and the path every asset URL in the
      # HTML has to be prefixed with. Both are computed from the repository name and
      # both can be overridden (the base path by a repository variable, the site URL by
      # a repository secret) for a custom domain in front of the same Pages deployment.
      - name: Resolve the Pages target
        id: target
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BASE_OVERRIDE: ${{ vars.VITE_BASE_PATH }}
          URL_OVERRIDE: ${{ secrets.VITE_SITE_URL }}
        run: |
          # The host is folded to lower case, because DNS is; the repository name is
          # not, because a Pages path is a case-sensitive lookup into the published
          # files -- "/neo4j-build-sprint/" would 404 every asset of "Neo4j-Build-Sprint".
          owner="$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          if [ -n "$BASE_OVERRIDE" ]; then
            base="$BASE_OVERRIDE"
            chosen_from="the VITE_BASE_PATH variable"
          elif [ "$repo_lc" = "$owner.github.io" ]; then
            base="/"
            chosen_from="a $owner.github.io repository"
          else
            base="/$REPO/"
            chosen_from="a project-site repository"
          fi
          case "$base" in
            /*/) ;;
            /*) base="$base/" ;;
            *) base="/$base" ;;
          esac
          if [ -n "$URL_OVERRIDE" ]; then
            url="$URL_OVERRIDE"
          else
            path="${base%/}"
            url="https://$owner.github.io$path"
          fi
          {
            echo "base=$base"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $url with base path $base (from $chosen_from)."

      # The Open Graph card is drawn from the dataset by scripts/emit-social-card.ts, so
      # it is rendered at deploy time rather than committed as a PNG that can drift away
      # from the numbers it advertises. Best effort, deliberately: a slow browser
      # download must not hold up a deployment, and without the file the build simply
      # omits og:image (see the socialCard block in vite.config.ts) instead of pointing a
      # link preview at something that 404s.
      - name: Render the social card
        continue-on-error: true
        run: |
          npx playwright install chromium
          npm run emit:social-card

      - name: Build
        # Values are optional: with no secrets the build produces a working
        # demo-mode site, which is a legitimate deployment. Set the Supabase
        # secrets, or the VITE_API_BASE_URL variable for the self-hosted
        # backend, and the same pipeline publishes a live-data site. When both
        # are set the explicit API base wins (see src/core/env.ts).
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CSP_EXTRA_CONNECT_SRC: ${{ vars.VITE_CSP_EXTRA_CONNECT_SRC }}
          VITE_SITE_URL: ${{ steps.target.outputs.url }}
          VITE_BASE_PATH: ${{ steps.target.outputs.base }}
          VITE_APP_VERSION: ${{ github.ref_name }}-${{ github.sha }}
        run: npm run build

      - name: Verify embedded API configuration
        env:
          API_BASE: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo 'No VITE_API_BASE_URL repository variable is set; this Pages artifact is demo-capable and will use bundled sample data.'
            echo '::warning title=Demo deployment::Set the public Actions repository variable VITE_API_BASE_URL to the actual backend /functions/v1 URL and run a new Pages build to connect live data.'
          else
            case "$API_BASE" in
              https://*) ;;
              *) echo '::error title=Invalid API base::VITE_API_BASE_URL must be an absolute HTTPS backend URL on GitHub Pages.'; exit 1 ;;
            esac
            case "$API_BASE" in
              *localhost*|*127.0.0.1*) echo '::error title=Invalid API base::A production Pages build cannot call localhost.'; exit 1 ;;
              */functions/v1) ;;
              *) echo '::error title=Invalid API base::VITE_API_BASE_URL must end in /functions/v1.'; exit 1 ;;
            esac
            grep -R -F -- "$API_BASE" dist/assets >/dev/null || { echo '::error::The configured backend URL was not embedded in the built assets.'; exit 1; }
            echo "Verified backend API base is embedded in the Pages artifact: $API_BASE"
          fi

      - name: Scan built artifact
        run: npm run lint:secrets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # What the published site has to be able to do, checked against the artifact that
      # was actually uploaded rather than against the source tree: the deep-link
      # fallback a host with no rewrite rules needs, and the asset paths that must carry
      # the base path. A deploy that fails here produced a page, just not a working one.
      # The rules themselves are unit-tested in tests/unit/github-pages.test.ts.
      - name: Check the published artifact
        if: always() && steps.deploy.outcome == 'success'
        # Values arrive through `env`, not `${{ }}` interpolation. A `${{ }}`
        # inside `run:` is substituted into the script *before* the shell sees
        # it, so any quote or `$( )` in the value becomes shell syntax — the
        # standard GitHub Actions script-injection pattern. Both values here come
        # from a step output rather than from a fork, but the safe form costs
        # nothing and survives the next person pointing this at event data.
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}
          PAGE_URL: ${{ steps.target.outputs.url }}
        run: |
          base="$BASE_PATH"
          fail() { echo "::error::$1"; exit 1; }
          test -f dist/404.html || fail 'dist/404.html is missing — deep links will show GitHub 404 page.'
          grep -q "href=\"${base}manifest.webmanifest\"" dist/index.html \
            || fail "index.html does not reference the manifest under $base — the base path is wrong."
          test -s dist/icons/icon-512.png || fail 'dist/icons/icon-512.png is missing — the PWA cannot install.'
          echo "Artifact checks passed: $(du -sh dist | cut -f1) published at $PAGE_URL"
