# Node website + Neo4j graph backend.
# Review hosting/disk charges before creating this Blueprint.
# Static hosts such as GitHub Pages cannot run this backend — deploy this
# service AND point the Pages build's VITE_API_BASE_URL at this service's URL
# (see docs/deployment.md).
#
# This one service runs:
#   - static site (dist/) when VITE_BASE_PATH=/ and VITE_API_BASE_URL is the
#     same origin,
#   - account API at /api/auth/* (sign-in + sync; this deployment's own DB),
#   - Neo4j graph API at /api/* and /functions/v1/* (genuine Cypher over Bolt),
#     with endpoints /api/health, /api/health/neo4j, /api/graph/stats,
#     /api/query, /api/graph/explore, /api/evidence/:id, /api/ledger/recent.
#
# REQUIRED: set the three NEO4J_* env vars (NEO4J_URI, NEO4J_USERNAME,
# NEO4J_PASSWORD) pointing at your Neo4j Aura instance. Without them the
# service starts but reports DATABASE UNAVAILABLE and the UI shows demo data.
services:
  - type: web
    name: graphmentor-neo4j
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: graphmentor-database
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Where the disk-backed account database lives.
      - key: GM_DATABASE_DIR
        value: /var/data/postgres
      # Neo4j connection (REQUIRED for live data). Set these in Render dashboard.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      # Build the frontend against same-origin /functions/v1 when serving the
      # static site from this service. For GitHub Pages cross-origin, rebuild
      # with VITE_API_BASE_URL pointing at this service instead.
      - key: VITE_API_BASE_URL
        value: /functions/v1
      - key: VITE_BASE_PATH
        value: /
      # Cross-origin callers: add your GitHub Pages URL here.
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:4173,https://authorsauravkushwaha.github.io
