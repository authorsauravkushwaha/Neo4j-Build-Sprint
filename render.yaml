# Node website + persistent server-side Postgres (PGlite).
# Review hosting/disk charges before creating this Blueprint.
# Static hosts such as GitHub Pages cannot run this backend.
#
# This one service is the whole live app:
#   - static site (dist/),
#   - account API at /api/* (this deployment's own account database),
#   - graph API at /functions/v1/* — the same endpoints the Supabase Edge
#     Functions serve, backed by THIS deployment's own PostgreSQL graph store
#     (server/graphStore.ts; seeded automatically on first boot).
# VITE_API_BASE_URL=/functions/v1 makes the built frontend call that same-origin
# API, so the site opens in live mode — no Supabase project or Neo4j account
# required. Paths A (GitHub Pages + this service) and B (Supabase + Neo4j Aura)
# are documented in docs/graph-database.md and docs/deployment.md.
services:
  - type: web
    name: graphmentor
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: graphmentor-database
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: GM_DATABASE_DIR
        value: /var/data/postgres
      # The graph store lives on the same persistent disk, next to accounts.
      - key: GM_GRAPH_DATABASE_DIR
        value: /var/data/graph-postgres
      # Same-origin graph API: build the frontend against /functions/v1.
      - key: VITE_API_BASE_URL
        value: /functions/v1
      - key: VITE_BASE_PATH
        value: /
      # Browsers calling the API cross-origin (e.g. a GitHub Pages build whose
      # VITE_API_BASE_URL points at this service) need the site's origin here,
      # comma separated. Same-origin deployments can leave it unset. Example:
      # https://authorsauravkushwaha.github.io
      - key: ALLOWED_ORIGINS
        sync: false
